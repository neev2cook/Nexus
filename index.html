<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus — AI Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            nexus: {
              dark: '#08080c',
              panel: '#0f0f14',
              border: '#1c1c26',
              accent: '#00d4ff',
              accentHover: '#00b8e0',
              user: '#00d4ff',
              assistant: '#15151e'
            }
          }
        }
      }
    }
  </script>
  <style>
    #messages::-webkit-scrollbar { width: 6px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    #messages::-webkit-scrollbar-thumb:hover { background: #555; }

    .typing-dot {
      animation: typing 1.4s infinite ease-in-out both;
    }
    .typing-dot:nth-child(1) { animation-delay: 0s; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    .message-enter {
      animation: fadeIn 0.25s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .glow {
      box-shadow: 0 0 18px rgba(0, 212, 255, 0.3);
    }
  </style>
</head>
<body class="bg-nexus-dark text-gray-100 h-screen flex flex-col overflow-hidden antialiased">

  <!-- Header -->
  <header class="border-b border-nexus-border bg-nexus-panel px-4 py-3 flex items-center justify-between shrink-0">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center text-sm font-bold text-black glow">
        N
      </div>
      <div>
        <h1 class="font-semibold text-lg leading-tight tracking-tight">Nexus</h1>
        <p class="text-xs text-gray-400">Your intelligent companion</p>
      </div>
    </div>
    <div class="flex items-center gap-1">
      <button id="settingsBtn" class="text-gray-400 hover:text-white p-2 rounded-lg hover:bg-nexus-border transition" title="Settings">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
      </button>
      <button id="clearBtn" class="text-gray-400 hover:text-white p-2 rounded-lg hover:bg-nexus-border transition" title="Clear chat">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        </svg>
      </button>
    </div>
  </header>

  <!-- Messages -->
  <main id="messages" class="flex-1 overflow-y-auto px-4 py-6 space-y-5">
    <div class="message-enter flex gap-3 max-w-3xl mx-auto">
      <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center text-xs font-bold text-black shrink-0">N</div>
      <div class="bg-nexus-assistant rounded-2xl rounded-tl-md px-4 py-3 text-sm leading-relaxed border border-nexus-border">
        <p>Hey, I'm <strong>Nexus</strong> — your intelligent companion.</p>
        <p class="mt-2 text-gray-400 text-xs">Open Settings ⚙️ to add your API key and start chatting.</p>
      </div>
    </div>
  </main>

  <!-- Input -->
  <footer class="border-t border-nexus-border bg-nexus-panel px-4 py-3 shrink-0">
    <div class="max-w-3xl mx-auto flex gap-2 items-end">
      <textarea
        id="userInput"
        rows="1"
        placeholder="Message Nexus..."
        class="flex-1 bg-nexus-dark border border-nexus-border rounded-2xl px-4 py-3 text-sm resize-none focus:outline-none focus:ring-2 focus:ring-nexus-accent focus:border-transparent max-h-32 overflow-y-auto placeholder-gray-500"
      ></textarea>
      <button
        id="sendBtn"
        class="bg-nexus-accent hover:bg-nexus-accentHover disabled:opacity-40 disabled:cursor-not-allowed text-black font-medium rounded-full w-11 h-11 flex items-center justify-center transition shrink-0 glow"
        title="Send"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
        </svg>
      </button>
    </div>
    <p class="text-center text-xs text-gray-500 mt-2">API key stays in your browser only</p>
  </footer>

  <!-- Settings Modal -->
  <div id="settingsModal" class="fixed inset-0 bg-black/70 hidden items-center justify-center z-50 p-4">
    <div class="bg-nexus-panel border border-nexus-border rounded-2xl w-full max-w-md p-6 shadow-2xl">
      <div class="flex items-center justify-between mb-5">
        <h2 class="text-lg font-semibold">Settings</h2>
        <button id="closeSettings" class="text-gray-400 hover:text-white text-2xl leading-none">&times;</button>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-sm text-gray-300 mb-1">API Key</label>
          <input
            id="apiKeyInput"
            type="password"
            placeholder="sk-... or your key"
            class="w-full bg-nexus-dark border border-nexus-border rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-nexus-accent"
          />
        </div>

        <div>
          <label class="block text-sm text-gray-300 mb-1">API Base URL</label>
          <input
            id="baseUrlInput"
            type="text"
            value="https://api.openai.com/v1"
            class="w-full bg-nexus-dark border border-nexus-border rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-nexus-accent"
          />
          <p class="text-xs text-gray-500 mt-1">OpenAI, Groq, Together, Fireworks, etc.</p>
        </div>

        <div>
          <label class="block text-sm text-gray-300 mb-1">Model</label>
          <input
            id="modelInput"
            type="text"
            value="gpt-4o-mini"
            class="w-full bg-nexus-dark border border-nexus-border rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-nexus-accent"
          />
        </div>

        <div>
          <label class="block text-sm text-gray-300 mb-1">System Prompt</label>
          <textarea
            id="systemPrompt"
            rows="3"
            class="w-full bg-nexus-dark border border-nexus-border rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-nexus-accent resize-none"
          >You are Nexus, a sharp, intelligent, and helpful AI companion. You answer clearly, stay curious, and never pretend to be human.</textarea>
        </div>

        <button
          id="saveSettings"
          class="w-full bg-nexus-accent hover:bg-nexus-accentHover text-black font-medium rounded-lg py-2.5 transition glow"
        >
          Save Settings
        </button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "nexus-chat-settings";

    const messagesEl   = document.getElementById("messages");
    const userInput    = document.getElementById("userInput");
    const sendBtn      = document.getElementById("sendBtn");
    const settingsBtn  = document.getElementById("settingsBtn");
    const clearBtn     = document.getElementById("clearBtn");
    const settingsModal= document.getElementById("settingsModal");
    const closeSettings= document.getElementById("closeSettings");
    const saveSettings = document.getElementById("saveSettings");
    const apiKeyInput  = document.getElementById("apiKeyInput");
    const baseUrlInput = document.getElementById("baseUrlInput");
    const modelInput   = document.getElementById("modelInput");
    const systemPrompt = document.getElementById("systemPrompt");

    let conversation = [];
    let isGenerating = false;

    function loadSettings() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
        if (saved.apiKey) apiKeyInput.value = saved.apiKey;
        if (saved.baseUrl) baseUrlInput.value = saved.baseUrl;
        if (saved.model) modelInput.value = saved.model;
        if (saved.systemPrompt) systemPrompt.value = saved.systemPrompt;
      } catch (e) {}
    }

    function saveSettingsToStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        apiKey: apiKeyInput.value.trim(),
        baseUrl: baseUrlInput.value.trim().replace(/\/$/, ""),
        model: modelInput.value.trim(),
        systemPrompt: systemPrompt.value.trim()
      }));
    }

    function getSettings() {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
      return {
        apiKey: apiKeyInput.value.trim() || saved.apiKey || "",
        baseUrl: (baseUrlInput.value.trim() || saved.baseUrl || "https://api.openai.com/v1").replace(/\/$/, ""),
        model: modelInput.value.trim() || saved.model || "gpt-4o-mini",
        systemPrompt: systemPrompt.value.trim() || saved.systemPrompt ||
          "You are Nexus, a sharp, intelligent, and helpful AI companion."
      };
    }

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function createMessage(role, content, isTyping = false) {
      const wrapper = document.createElement("div");
      wrapper.className = "message-enter flex gap-3 max-w-3xl mx-auto " + (role === "user" ? "flex-row-reverse" : "");

      const avatar = document.createElement("div");
      avatar.className = "w-8 h-8 rounded-xl flex items-center justify-center text-xs font-bold shrink-0 " +
        (role === "user"
          ? "bg-nexus-user text-black"
          : "bg-gradient-to-br from-cyan-400 to-blue-600 text-black");
      avatar.textContent = role === "user" ? "You" : "N";

      const bubble = document.createElement("div");
      bubble.className = "rounded-2xl px-4 py-3 text-sm leading-relaxed max-w-[85%] whitespace-pre-wrap break-words border " +
        (role === "user"
          ? "bg-nexus-user text-black rounded-tr-md border-transparent"
          : "bg-nexus-assistant rounded-tl-md border-nexus-border");

      if (isTyping) {
        bubble.innerHTML = `
          <div class="flex gap-1.5 items-center h-5">
            <span class="typing-dot w-2 h-2 bg-gray-400 rounded-full"></span>
            <span class="typing-dot w-2 h-2 bg-gray-400 rounded-full"></span>
            <span class="typing-dot w-2 h-2 bg-gray-400 rounded-full"></span>
          </div>`;
      } else {
        bubble.textContent = content;
      }

      wrapper.appendChild(avatar);
      wrapper.appendChild(bubble);
      return { wrapper, bubble };
    }

    function addMessage(role, content) {
      const { wrapper } = createMessage(role, content);
      messagesEl.appendChild(wrapper);
      scrollToBottom();
    }

    function showTyping() {
      const { wrapper } = createMessage("assistant", "", true);
      wrapper.id = "typing-indicator";
      messagesEl.appendChild(wrapper);
      scrollToBottom();
    }

    function removeTyping() {
      document.getElementById("typing-indicator")?.remove();
    }

    function setGenerating(state) {
      isGenerating = state;
      sendBtn.disabled = state;
      userInput.disabled = state;
    }

    userInput.addEventListener("input", () => {
      userInput.style.height = "auto";
      userInput.style.height = Math.min(userInput.scrollHeight, 128) + "px";
    });

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text || isGenerating) return;

      const settings = getSettings();
      if (!settings.apiKey) {
        alert("Please add your API key in Settings first.");
        openSettings();
        return;
      }

      addMessage("user", text);
      conversation.push({ role: "user", content: text });
      userInput.value = "";
      userInput.style.height = "auto";

      setGenerating(true);
      showTyping();

      try {
        const messages = [
          { role: "system", content: settings.systemPrompt },
          ...conversation
        ];

        const response = await fetch(`${settings.baseUrl}/chat/completions`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${settings.apiKey}`
          },
          body: JSON.stringify({
            model: settings.model,
            messages: messages,
            temperature: 0.7
          })
        });

        removeTyping();

        if (!response.ok) {
          const err = await response.json().catch(() => ({}));
          throw new Error(err.error?.message || err.message || `HTTP ${response.status}`);
        }

        const data = await response.json();
        const reply = data.choices?.[0]?.message?.content?.trim() || "No response.";

        addMessage("assistant", reply);
        conversation.push({ role: "assistant", content: reply });

      } catch (err) {
        removeTyping();
        console.error(err);
        addMessage("assistant", `⚠️ Error: ${err.message}\n\nCheck your API key, base URL, and model name.`);
      } finally {
        setGenerating(false);
        userInput.focus();
      }
    }

    sendBtn.addEventListener("click", sendMessage);
    userInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    clearBtn.addEventListener("click", () => {
      if (confirm("Clear the entire conversation?")) {
        conversation = [];
        messagesEl.innerHTML = "";
        const welcome = createMessage("assistant", "Chat cleared. What's on your mind?");
        messagesEl.appendChild(welcome.wrapper);
      }
    });

    function openSettings() {
      loadSettings();
      settingsModal.classList.remove("hidden");
      settingsModal.classList.add("flex");
    }
    function closeSettingsModal() {
      settingsModal.classList.add("hidden");
      settingsModal.classList.remove("flex");
    }

    settingsBtn.addEventListener("click", openSettings);
    closeSettings.addEventListener("click", closeSettingsModal);
    settingsModal.addEventListener("click", (e) => {
      if (e.target === settingsModal) closeSettingsModal();
    });
    saveSettings.addEventListener("click", () => {
      saveSettingsToStorage();
      closeSettingsModal();
    });

    loadSettings();
    userInput.focus();
  </script>
</body>
</html>
