<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus — Coding AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            nexus: {
              dark: '#08080c',
              panel: '#0f0f14',
              border: '#1c1c26',
              accent: '#00d4ff',
              accentHover: '#00b8e0',
              user: '#00d4ff',
              assistant: '#15151e'
            }
          }
        }
      }
    }
  </script>
  <style>
    #messages::-webkit-scrollbar { width: 6px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

    .typing-dot {
      animation: typing 1.4s infinite ease-in-out both;
    }
    .typing-dot:nth-child(1) { animation-delay: 0s; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    .message-enter {
      animation: fadeIn 0.25s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .glow {
      box-shadow: 0 0 18px rgba(0, 212, 255, 0.3);
    }

    pre {
      background: #0d0d12;
      border-radius: 8px;
      padding: 12px;
      overflow-x: auto;
      font-size: 13px;
      margin-top: 8px;
    }

    .youtube-card {
      display: flex;
      gap: 12px;
      padding: 10px;
      background: #0d0d12;
      border-radius: 10px;
      margin-top: 8px;
      transition: background 0.2s;
    }
    .youtube-card:hover {
      background: #16161f;
    }
  </style>
</head>
<body class="bg-nexus-dark text-gray-100 h-screen flex flex-col overflow-hidden antialiased">

  <!-- Header -->
  <header class="border-b border-nexus-border bg-nexus-panel px-4 py-3 flex items-center justify-between shrink-0">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center text-sm font-bold text-black glow">
        N
      </div>
      <div>
        <h1 class="font-semibold text-lg leading-tight tracking-tight">Nexus</h1>
        <p class="text-xs text-gray-400">Coding AI + YouTube Tutorials</p>
      </div>
    </div>
    <button id="clearBtn" class="text-gray-400 hover:text-white p-2 rounded-lg hover:bg-nexus-border transition" title="Clear chat">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
      </svg>
    </button>
  </header>

  <!-- Messages -->
  <main id="messages" class="flex-1 overflow-y-auto px-4 py-6 space-y-5">
    <div class="message-enter flex gap-3 max-w-3xl mx-auto">
      <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center text-xs font-bold text-black shrink-0">N</div>
      <div class="bg-nexus-assistant rounded-2xl rounded-tl-md px-4 py-3 text-sm leading-relaxed border border-nexus-border">
        <p>Hey, I'm <strong>Nexus</strong> — your coding AI.</p>
        <p class="mt-2 text-gray-400 text-xs">
          Ask me to write/debug code, or type <strong>"youtube: react hooks"</strong> to search tutorials.
        </p>
      </div>
    </div>
  </main>

  <!-- Input -->
  <footer class="border-t border-nexus-border bg-nexus-panel px-4 py-3 shrink-0">
    <div class="max-w-3xl mx-auto flex gap-2 items-end">
      <textarea
        id="userInput"
        rows="1"
        placeholder="Ask about code or type youtube: topic..."
        class="flex-1 bg-nexus-dark border border-nexus-border rounded-2xl px-4 py-3 text-sm resize-none focus:outline-none focus:ring-2 focus:ring-nexus-accent focus:border-transparent max-h-32 overflow-y-auto placeholder-gray-500"
      ></textarea>
      <button
        id="sendBtn"
        class="bg-nexus-accent hover:bg-nexus-accentHover disabled:opacity-40 disabled:cursor-not-allowed text-black font-medium rounded-full w-11 h-11 flex items-center justify-center transition shrink-0 glow"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
        </svg>
      </button>
    </div>
  </footer>

  <script>
    // ======================
    // YOUR API KEYS
    // ======================
    const HF_TOKEN = "AIzaSyCDfTGs88xAN1DmD-iWpSY0ojRiFstiThI";
    const YOUTUBE_API_KEY = "YOUR_YOUTUBE_API_KEY_HERE";   // ← Put your YouTube API key here

    const MODEL = "meta-llama/Meta-Llama-3.1-8B-Instruct";
    // ======================

    let conversation = [];
    let isGenerating = false;

    const messagesEl = document.getElementById("messages");
    const userInput  = document.getElementById("userInput");
    const sendBtn    = document.getElementById("sendBtn");
    const clearBtn   = document.getElementById("clearBtn");

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function createMessage(role, content, isTyping = false, isHTML = false) {
      const wrapper = document.createElement("div");
      wrapper.className = "message-enter flex gap-3 max-w-3xl mx-auto " + (role === "user" ? "flex-row-reverse" : "");

      const avatar = document.createElement("div");
      avatar.className = "w-8 h-8 rounded-xl flex items-center justify-center text-xs font-bold shrink-0 " +
        (role === "user" ? "bg-nexus-user text-black" : "bg-gradient-to-br from-cyan-400 to-blue-600 text-black");
      avatar.textContent = role === "user" ? "You" : "N";

      const bubble = document.createElement("div");
      bubble.className = "rounded-2xl px-4 py-3 text-sm leading-relaxed max-w-[85%] break-words border " +
        (role === "user"
          ? "bg-nexus-user text-black rounded-tr-md border-transparent"
          : "bg-nexus-assistant rounded-tl-md border-nexus-border");

      if (isTyping) {
        bubble.innerHTML = `
          <div class="flex gap-1.5 items-center h-5">
            <span class="typing-dot w-2 h-2 bg-gray-400 rounded-full"></span>
            <span class="typing-dot w-2 h-2 bg-gray-400 rounded-full"></span>
            <span class="typing-dot w-2 h-2 bg-gray-400 rounded-full"></span>
          </div>`;
      } else if (isHTML) {
        bubble.innerHTML = content;
      } else {
        // Basic code formatting
        bubble.innerHTML = content
          .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
          .replace(/`([^`]+)`/g, '<code class="bg-black/40 px-1 rounded">$1</code>');
      }

      wrapper.appendChild(avatar);
      wrapper.appendChild(bubble);
      return { wrapper };
    }

    function addMessage(role, content, isHTML = false) {
      const { wrapper } = createMessage(role, content, false, isHTML);
      messagesEl.appendChild(wrapper);
      scrollToBottom();
    }

    function showTyping() {
      const { wrapper } = createMessage("assistant", "", true);
      wrapper.id = "typing-indicator";
      messagesEl.appendChild(wrapper);
      scrollToBottom();
    }

    function removeTyping() {
      document.getElementById("typing-indicator")?.remove();
    }

    function setGenerating(state) {
      isGenerating = state;
      sendBtn.disabled = state;
      userInput.disabled = state;
    }

    userInput.addEventListener("input", () => {
      userInput.style.height = "auto";
      userInput.style.height = Math.min(userInput.scrollHeight, 128) + "px";
    });

    // ===== YouTube Search (results appear in chat) =====
    async function searchYouTube(query) {
      if (!YOUTUBE_API_KEY || YOUTUBE_API_KEY === "YOUR_YOUTUBE_API_KEY_HERE") {
        addMessage("assistant", "⚠️ Please add your YouTube API key in the code first.");
        return;
      }

      showTyping();

      try {
        const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(query + " programming tutorial")}&type=video&maxResults=5&key=${YOUTUBE_API_KEY}`;
        const res = await fetch(url);
        const data = await res.json();

        removeTyping();

        if (!data.items || data.items.length === 0) {
          addMessage("assistant", "No YouTube tutorials found for that topic.");
          return;
        }

        let html = `<p class="mb-2">Here are some YouTube tutorials for <strong>${query}</strong>:</p>`;

        data.items.forEach(item => {
          html += `
            <a href="https://www.youtube.com/watch?v=${item.id.videoId}" target="_blank" class="youtube-card">
              <img src="${item.snippet.thumbnails.medium.url}" class="w-28 h-16 object-cover rounded" />
              <div class="flex-1 min-w-0">
                <p class="font-medium text-sm line-clamp-2">${item.snippet.title}</p>
                <p class="text-xs text-gray-400 mt-1">${item.snippet.channelTitle}</p>
              </div>
            </a>
          `;
        });

        addMessage("assistant", html, true);

      } catch (err) {
        removeTyping();
        addMessage("assistant", `⚠️ YouTube Error: ${err.message}`);
      }
    }

    // ===== Main Chat =====
    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text || isGenerating) return;

      // Check if user wants YouTube search
      if (text.toLowerCase().startsWith("youtube:")) {
        const query = text.slice(8).trim();
        addMessage("user", text);
        userInput.value = "";
        userInput.style.height = "auto";
        await searchYouTube(query);
        return;
      }

      addMessage("user", text);
      conversation.push({ role: "user", content: text });
      userInput.value = "";
      userInput.style.height = "auto";

      setGenerating(true);
      showTyping();

      try {
        const messages = [
          {
            role: "system",
            content: `You are Nexus, an expert coding AI assistant.
You help users write clean, modern code, debug problems, explain concepts, and follow best practices.
Always use clear explanations and well-formatted code blocks.
Be practical, concise, and helpful.`
          },
          ...conversation
        ];

        const response = await fetch("https://router.huggingface.co/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${HF_TOKEN}`
          },
          body: JSON.stringify({
            model: MODEL,
            messages: messages,
            temperature: 0.4,
            max_tokens: 1500
          })
        });

        removeTyping();

        if (!response.ok) {
          const err = await response.json().catch(() => ({}));
          throw new Error(err.error?.message || err.message || `Error ${response.status}`);
        }

        const data = await response.json();
        const reply = data.choices?.[0]?.message?.content?.trim() || "No response.";

        addMessage("assistant", reply);
        conversation.push({ role: "assistant", content: reply });

      } catch (err) {
        removeTyping();
        console.error(err);
        addMessage("assistant", `⚠️ Error: ${err.message}`);
      } finally {
        setGenerating(false);
        userInput.focus();
      }
    }

    // Events
    sendBtn.addEventListener("click", sendMessage);
    userInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    clearBtn.addEventListener("click", () => {
      if (confirm("Clear the conversation?")) {
        conversation = [];
        messagesEl.innerHTML = "";
        const welcome = createMessage("assistant", "Chat cleared. What code can I help with?");
        messagesEl.appendChild(welcome.wrapper);
      }
    });

    userInput.focus();
  </script>
</body>
</html>
