<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus — AI Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            nexus: {
              dark: '#08080c',
              panel: '#0f0f14',
              border: '#1c1c26',
              accent: '#00d4ff',
              accentHover: '#00b8e0',
              user: '#00d4ff',
              assistant: '#15151e'
            }
          }
        }
      }
    }
  </script>
  <style>
    #messages::-webkit-scrollbar { width: 6px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

    .typing-dot {
      animation: typing 1.4s infinite ease-in-out both;
    }
    .typing-dot:nth-child(1) { animation-delay: 0s; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    .message-enter {
      animation: fadeIn 0.25s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .glow {
      box-shadow: 0 0 18px rgba(0, 212, 255, 0.3);
    }
  </style>
</head>
<body class="bg-nexus-dark text-gray-100 h-screen flex flex-col overflow-hidden antialiased">

  <!-- LOGIN SCREEN -->
  <div id="loginScreen" class="fixed inset-0 bg-nexus-dark flex flex-col items-center justify-center z-50 px-4">
    <div class="text-center max-w-sm w-full">
      <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center text-2xl font-bold text-black mx-auto mb-6 glow">
        N
      </div>
      <h1 class="text-3xl font-bold mb-2">Nexus</h1>
      <p class="text-gray-400 mb-8">Sign in with Google to continue</p>

      <div id="g_id_onload"
           data-client_id="YOUR_GOOGLE_CLIENT_ID"
           data-callback="handleGoogleSignIn"
           data-auto_prompt="false">
      </div>
      <div class="g_id_signin flex justify-center"
           data-type="standard"
           data-size="large"
           data-theme="filled_black"
           data-text="signin_with"
           data-shape="rectangular"
           data-logo_alignment="left">
      </div>

      <p class="text-xs text-gray-500 mt-8">No API key needed • Free AI</p>
    </div>
  </div>

  <!-- CHAT APP -->
  <div id="chatApp" class="hidden flex flex-col h-screen">
    <header class="border-b border-nexus-border bg-nexus-panel px-4 py-3 flex items-center justify-between shrink-0">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center text-sm font-bold text-black glow">N</div>
        <div>
          <h1 class="font-semibold text-lg leading-tight tracking-tight">Nexus</h1>
          <p class="text-xs text-gray-400" id="userEmail">Signed in</p>
        </div>
      </div>
      <div class="flex items-center gap-1">
        <button id="logoutBtn" class="text-gray-400 hover:text-white p-2 rounded-lg hover:bg-nexus-border transition" title="Sign out">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
        </button>
      </div>
    </header>

    <main id="messages" class="flex-1 overflow-y-auto px-4 py-6 space-y-5">
      <div class="message-enter flex gap-3 max-w-3xl mx-auto">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center text-xs font-bold text-black shrink-0">N</div>
        <div class="bg-nexus-assistant rounded-2xl rounded-tl-md px-4 py-3 text-sm leading-relaxed border border-nexus-border">
          <p>Hey, I'm <strong>Nexus</strong>.</p>
          <p class="mt-2 text-gray-400 text-xs">No API key needed. Just start chatting!</p>
        </div>
      </div>
    </main>

    <footer class="border-t border-nexus-border bg-nexus-panel px-4 py-3 shrink-0">
      <div class="max-w-3xl mx-auto flex gap-2 items-end">
        <textarea
          id="userInput"
          rows="1"
          placeholder="Message Nexus..."
          class="flex-1 bg-nexus-dark border border-nexus-border rounded-2xl px-4 py-3 text-sm resize-none focus:outline-none focus:ring-2 focus:ring-nexus-accent focus:border-transparent max-h-32 overflow-y-auto placeholder-gray-500"
        ></textarea>
        <button
          id="sendBtn"
          class="bg-nexus-accent hover:bg-nexus-accentHover disabled:opacity-40 disabled:cursor-not-allowed text-black font-medium rounded-full w-11 h-11 flex items-center justify-center transition shrink-0 glow"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
          </svg>
        </button>
      </div>
    </footer>
  </div>

  <script>
    // ======================
    // NO API KEY NEEDED
    // Uses free public AI (Pollinations)
    // ======================

    let conversation = [];
    let isGenerating = false;
    let currentUser = null;

    const loginScreen  = document.getElementById("loginScreen");
    const chatApp      = document.getElementById("chatApp");
    const messagesEl   = document.getElementById("messages");
    const userInput    = document.getElementById("userInput");
    const sendBtn      = document.getElementById("sendBtn");
    const logoutBtn    = document.getElementById("logoutBtn");
    const userEmailEl  = document.getElementById("userEmail");

    // Google Sign-In
    function handleGoogleSignIn(response) {
      const payload = JSON.parse(atob(response.credential.split('.')[1]));
      currentUser = {
        name: payload.name,
        email: payload.email
      };
      localStorage.setItem("nexus-user", JSON.stringify(currentUser));
      showChat();
    }
    window.handleGoogleSignIn = handleGoogleSignIn;

    function showChat() {
      loginScreen.classList.add("hidden");
      chatApp.classList.remove("hidden");
      chatApp.classList.add("flex");
      if (currentUser) userEmailEl.textContent = currentUser.email;
      userInput.focus();
    }

    function logout() {
      localStorage.removeItem("nexus-user");
      location.reload();
    }

    // Check existing login
    const savedUser = localStorage.getItem("nexus-user");
    if (savedUser) {
      currentUser = JSON.parse(savedUser);
      showChat();
    }

    // Chat helpers
    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function createMessage(role, content, isTyping = false) {
      const wrapper = document.createElement("div");
      wrapper.className = "message-enter flex gap-3 max-w-3xl mx-auto " + (role === "user" ? "flex-row-reverse" : "");

      const avatar = document.createElement("div");
      avatar.className = "w-8 h-8 rounded-xl flex items-center justify-center text-xs font-bold shrink-0 " +
        (role === "user" ? "bg-nexus-user text-black" : "bg-gradient-to-br from-cyan-400 to-blue-600 text-black");
      avatar.textContent = role === "user" ? "You" : "N";

      const bubble = document.createElement("div");
      bubble.className = "rounded-2xl px-4 py-3 text-sm leading-relaxed max-w-[85%] whitespace-pre-wrap break-words border " +
        (role === "user" ? "bg-nexus-user text-black rounded-tr-md border-transparent" : "bg-nexus-assistant rounded-tl-md border-nexus-border");

      if (isTyping) {
        bubble.innerHTML = `<div class="flex gap-1.5 items-center h-5">
          <span class="typing-dot w-2 h-2 bg-gray-400 rounded-full"></span>
          <span class="typing-dot w-2 h-2 bg-gray-400 rounded-full"></span>
          <span class="typing-dot w-2 h-2 bg-gray-400 rounded-full"></span>
        </div>`;
      } else {
        bubble.textContent = content;
      }

      wrapper.appendChild(avatar);
      wrapper.appendChild(bubble);
      return { wrapper };
    }

    function addMessage(role, content) {
      const { wrapper } = createMessage(role, content);
      messagesEl.appendChild(wrapper);
      scrollToBottom();
    }

    function showTyping() {
      const { wrapper } = createMessage("assistant", "", true);
      wrapper.id = "typing-indicator";
      messagesEl.appendChild(wrapper);
      scrollToBottom();
    }

    function removeTyping() {
      document.getElementById("typing-indicator")?.remove();
    }

    function setGenerating(state) {
      isGenerating = state;
      sendBtn.disabled = state;
      userInput.disabled = state;
    }

    userInput.addEventListener("input", () => {
      userInput.style.height = "auto";
      userInput.style.height = Math.min(userInput.scrollHeight, 128) + "px";
    });

    // Free AI call (no key)
    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text || isGenerating) return;

      addMessage("user", text);
      conversation.push({ role: "user", content: text });
      userInput.value = "";
      userInput.style.height = "auto";

      setGenerating(true);
      showTyping();

      try {
        // Build a simple prompt with history
        let prompt = "You are Nexus, a helpful and intelligent AI assistant.\n\n";
        conversation.forEach(msg => {
          prompt += `${msg.role === "user" ? "User" : "Nexus"}: ${msg.content}\n`;
        });
        prompt += "Nexus:";

        // Free public endpoint - no API key needed
        const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}?model=openai`);

        removeTyping();

        if (!response.ok) throw new Error("AI service temporarily unavailable");

        const reply = (await response.text()).trim() || "Sorry, I couldn't generate a reply.";

        addMessage("assistant", reply);
        conversation.push({ role: "assistant", content: reply });

      } catch (err) {
        removeTyping();
        addMessage("assistant", `⚠️ Error: ${err.message}\n\nTry again in a moment.`);
      } finally {
        setGenerating(false);
        userInput.focus();
      }
    }

    sendBtn.addEventListener("click", sendMessage);
    userInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    logoutBtn.addEventListener("click", logout);
  </script>
</body>
</html>
